<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promosi Media Sosial</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(ellipse at 80% 15%, rgba(211, 60, 33, 0.2), transparent 35%),
                linear-gradient(135deg, #10151a, #252d34 55%, #0c1014);
            color: #f4f5f6;
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            overflow-x: hidden;
            position: relative;
            isolation: isolate;
        }

        .garage-scene {
            position: fixed;
            z-index: -1;
            inset: 0;
            overflow: hidden;
            perspective: 1100px;
            pointer-events: none;
            background:
                linear-gradient(180deg, transparent 0 58%, rgba(5, 8, 11, 0.75) 100%),
                repeating-linear-gradient(90deg, transparent 0 11%, rgba(255, 255, 255, 0.025) 11.1% 11.25%, transparent 11.35% 22%);
        }

        .garage-scene::before {
            content: "";
            position: absolute;
            inset: 0 0 38%;
            background:
                linear-gradient(90deg, transparent 0 17%, rgba(236, 63, 30, 0.11) 17.2% 17.5%, transparent 17.7% 82%, rgba(236, 63, 30, 0.1) 82.2% 82.5%, transparent 82.7%),
                repeating-linear-gradient(0deg, transparent 0 78px, rgba(255, 255, 255, 0.035) 79px 80px, transparent 81px 160px);
            opacity: 0.75;
        }

        .garage-scene::after {
            content: "";
            position: absolute;
            z-index: 0;
            left: 28%;
            right: -10%;
            bottom: -25%;
            height: 67%;
            transform: rotateX(66deg);
            transform-origin: center top;
            background:
                radial-gradient(ellipse at 58% 20%, rgba(255, 71, 36, 0.22), transparent 38%),
                repeating-linear-gradient(90deg, transparent 0 95px, rgba(255, 255, 255, 0.07) 96px 98px, transparent 99px 190px),
                repeating-linear-gradient(0deg, transparent 0 65px, rgba(255, 255, 255, 0.065) 66px 68px, transparent 69px 130px),
                linear-gradient(#252c32, #101419 55%);
            box-shadow: 0 -20px 50px rgba(0, 0, 0, 0.55);
        }

        .motorcycle {
            position: absolute;
            z-index: 1;
            right: 0;
            bottom: -10%;
            width: min(82vw, 1050px);
            max-height: 88vh;
            filter: drop-shadow(0 38px 28px rgba(0, 0, 0, 0.66));
            transform: rotateY(-10deg) rotateX(2deg);
            opacity: 0.42;
            animation: bike-arrive 1.2s ease-out both;
        }

        @keyframes bike-arrive {
            from { transform: translateX(55px) rotateY(-15deg) rotateX(2deg); }
            to { transform: translateX(0) rotateY(-10deg) rotateX(2deg); }
        }

        .container {
            position: relative;
            z-index: 1;
            width: min(100%, 1060px);
            margin: 0 auto;
            padding: 64px 24px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .eyebrow {
            margin: 0 0 10px;
            color: #ff9773;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 6vw, 3.5rem);
            line-height: 1.1;
            background: linear-gradient(45deg, #ff7655, #ffc071);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .intro {
            max-width: 620px;
            margin: 14px 0 32px;
            color: #c2c9ce;
            line-height: 1.7;
        }

        .social-icons {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 22px;
            margin: 0;
        }

        .social-icons a {
            min-height: 206px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            gap: 17px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 22px;
            background: linear-gradient(145deg, rgba(25, 31, 36, 0.94), rgba(12, 16, 20, 0.9));
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.3);
            transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
        }

        .social-logo {
            position: relative;
            display: grid;
            width: 76px;
            height: 76px;
            flex: 0 0 76px;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 23px;
            isolation: isolate;
            box-shadow:
                0 8px 0 var(--logo-edge),
                0 15px 23px rgba(0, 0, 0, 0.46),
                inset 0 2px 3px rgba(255, 255, 255, 0.55),
                inset 0 -5px 9px rgba(0, 0, 0, 0.28);
            transform: perspective(220px) rotateX(8deg) rotateY(-9deg);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .social-logo::before {
            content: "";
            position: absolute;
            z-index: -1;
            inset: 5px;
            border: 1px solid rgba(255, 255, 255, 0.17);
            border-radius: 17px;
            box-shadow: inset 0 1px 4px rgba(255, 255, 255, 0.1);
        }

        .social-logo::after {
            content: "";
            position: absolute;
            z-index: 2;
            inset: 1px;
            border-radius: inherit;
            background: linear-gradient(140deg, rgba(255, 255, 255, 0.25), transparent 37%, transparent 68%, rgba(255, 255, 255, 0.04));
            pointer-events: none;
        }

        .social-logo svg {
            position: relative;
            z-index: 1;
            width: 44px;
            height: 44px;
            overflow: visible;
            filter:
                drop-shadow(0 3px 0 rgba(0, 0, 0, 0.42))
                drop-shadow(0 5px 5px rgba(0, 0, 0, 0.35));
        }

        .social-logo--tiktok {
            --logo-edge: #111820;
            background: linear-gradient(145deg, #44505a 0%, #252d34 42%, #11171c 100%);
        }

        .social-logo--youtube {
            --logo-edge: #aa201a;
            background: linear-gradient(145deg, #ff7468 0%, #ed4035 46%, #b51e1a 100%);
        }

        .social-logo--facebook {
            --logo-edge: #143b78;
            background: linear-gradient(145deg, #77b2ff 0%, #347de0 46%, #17488f 100%);
        }

        .social-icons a:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 129, 91, 0.7);
            background: rgba(23, 28, 32, 0.94);
        }

        .social-icons a:hover .social-logo {
            transform: perspective(220px) translateY(-4px) rotateX(0) rotateY(0) scale(1.06);
            box-shadow:
                0 4px 0 var(--logo-edge),
                0 19px 27px rgba(0, 0, 0, 0.5),
                inset 0 2px 3px rgba(255, 255, 255, 0.68),
                inset 0 -5px 9px rgba(0, 0, 0, 0.25);
        }

        .social-title {
            color: #f4f5f6;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .social-caption {
            color: #adb6bc;
            font-size: 0.9rem;
        }

        .cta-button {
            display: inline-block;
            margin-top: 28px;
            padding: 12px 18px;
            background: linear-gradient(45deg, #e8442c, #ff9b50);
            color: white;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 999px;
            box-shadow: 0 8px 22px rgba(239, 75, 43, 0.35);
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            text-decoration: none;
            text-align: center;
        }

        .cta-button:hover {
            background: linear-gradient(45deg, #ff4b2b, #ff7b43);
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 80, 44, 0.45);
        }

        .cta-button:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 4px;
        }

        .social-icons a:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 4px;
        }

        @media (max-width: 760px) {
            .container {
                padding: 42px 18px;
            }

            .social-icons {
                gap: 16px;
            }

            .motorcycle {
                width: 115vw;
                right: -24%;
                bottom: -1%;
                opacity: 0.3;
            }
        }

        @media (max-width: 520px) {
            .social-icons {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .social-icons a {
                min-height: auto;
                flex-direction: row;
                justify-content: flex-start;
                padding: 16px;
            }

            .social-copy {
                display: grid;
                gap: 4px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
